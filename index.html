<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ERRANTE · Oil Change Service</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;600;700;800&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0A0A0A;
    --surface: #141414;
    --border: #222;
    --amber: #F5A623;
    --white: #F0EDE6;
    --muted: #555;
    --muted2: #333;
  }

  html, body {
    min-height: 100%;
    background: var(--bg);
    color: var(--white);
    font-family: 'Barlow', sans-serif;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(245,166,35,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(245,166,35,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .page {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 56px 24px 64px;
    max-width: 480px;
    margin: 0 auto;
  }

  .accent-bar {
    width: 48px;
    height: 3px;
    background: var(--amber);
    margin-bottom: 40px;
    animation: grow 0.6s ease forwards;
  }
  @keyframes grow { from { width: 0; opacity: 0; } to { width: 48px; opacity: 1; } }

  .brand {
    text-align: center;
    margin-bottom: 36px;
    animation: fadeUp 0.5s ease 0.2s both;
  }
  .brand-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 58px;
    font-weight: 800;
    letter-spacing: 8px;
    line-height: 1;
    color: #FFFFFF;
    text-transform: uppercase;
  }
  .brand-sub {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 8px;
  }
  .brand-tagline {
    font-size: 13px;
    font-weight: 300;
    color: #3A3A3A;
    margin-top: 8px;
    letter-spacing: 1px;
  }

  .divider {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 32px;
    animation: fadeUp 0.5s ease 0.3s both;
  }
  .divider-line { flex: 1; height: 1px; background: var(--border); }
  .divider-dot { width: 5px; height: 5px; background: var(--amber); border-radius: 50%; }

  .links { width: 100%; display: flex; flex-direction: column; gap: 14px; }

  .link-btn {
    display: flex;
    align-items: center;
    gap: 18px;
    width: 100%;
    padding: 18px 22px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    text-decoration: none;
    color: var(--white);
    cursor: pointer;
    transition: background 0.18s, border-color 0.18s, transform 0.12s;
    position: relative;
    overflow: hidden;
    animation: fadeUp 0.5s ease both;
  }
  .link-btn:nth-child(1) { animation-delay: 0.35s; }
  .link-btn:nth-child(2) { animation-delay: 0.45s; }

  .link-btn::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--amber);
    transform: scaleY(0);
    transition: transform 0.2s ease;
    transform-origin: bottom;
  }
  .link-btn:hover { background: #1A1A1A; border-color: #333; transform: translateX(4px); }
  .link-btn:hover::before { transform: scaleY(1); }
  .link-btn:active { transform: translateX(2px) scale(0.99); }

  .link-icon {
    width: 42px;
    height: 42px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .link-icon.wa { background: #1A2A1A; }
  .link-icon.ig { background: linear-gradient(45deg, #F58529, #DD2A7B, #515BD4); }

  .link-text { flex: 1; }
  .link-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--white);
  }
  .link-desc {
    font-size: 12px;
    font-weight: 300;
    color: var(--muted);
    margin-top: 2px;
    letter-spacing: 0.5px;
  }

  .link-arrow {
    color: var(--muted2);
    font-size: 18px;
    transition: color 0.18s, transform 0.18s;
  }
  .link-btn:hover .link-arrow { color: var(--amber); transform: translateX(3px); }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .footer {
    margin-top: 52px;
    text-align: center;
    animation: fadeUp 0.5s ease 0.6s both;
  }
  .footer-line { width: 24px; height: 1px; background: var(--border); margin: 0 auto 16px; }
  .footer-text {
    font-size: 11px;
    letter-spacing: 2px;
    color: #2A2A2A;
    text-transform: uppercase;
  }
</style>
</head>
<body>
<div class="page">

  <div class="accent-bar"></div>

  <div class="brand">
    <div class="brand-name">ERRANTE</div>
    <div class="brand-sub">Oil Change Service</div>
    <div class="brand-tagline">Cambio de aceite a domicilio</div>
  </div>

  <div class="divider">
    <div class="divider-line"></div>
    <div class="divider-dot"></div>
    <div class="divider-line"></div>
  </div>

  <div class="links">

    <a class="link-btn" href="https://wa.me/4491574571?text=Hola,%20%C2%BFme%20puedes%20brindar%20informaci%C3%B3n%20acerca%20de%20sus%20servicios%3F" target="_blank" rel="noopener">
      <div class="link-icon wa">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M12 2C6.477 2 2 6.477 2 12c0 1.89.525 3.66 1.438 5.168L2 22l4.978-1.41A9.96 9.96 0 0012 22c5.523 0 10-4.477 10-10S17.523 2 12 2z" fill="#25D366"/>
          <path d="M8.5 8.5c.2-.4.8-1.5 1.5-1.5.4 0 .6.1.8.5l1 2.2c.1.3 0 .6-.2.8l-.5.6c.4.7 1.1 1.4 1.8 1.8l.6-.5c.2-.2.5-.3.8-.2l2.2 1.0c.4.2.5.4.5.8 0 .7-1.1 1.3-1.5 1.5-1.5.5-5.5-2-6.5-5z" fill="white"/>
        </svg>
      </div>
      <div class="link-text">
        <div class="link-title">Escríbenos por WhatsApp</div>
        <div class="link-desc">Cotiza tu servicio ahora mismo</div>
      </div>
      <div class="link-arrow">→</div>
    </a>

    <a class="link-btn" href="https://instagram.com/errante.oilchange" target="_blank" rel="noopener">
      <div class="link-icon ig">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <rect x="2" y="2" width="20" height="20" rx="5" stroke="white" stroke-width="1.8" fill="none"/>
          <circle cx="12" cy="12" r="4.5" stroke="white" stroke-width="1.8" fill="none"/>
          <circle cx="17.5" cy="6.5" r="1.2" fill="white"/>
        </svg>
      </div>
      <div class="link-text">
        <div class="link-title">Síguenos en Instagram</div>
        <div class="link-desc">@errante.oilchange</div>
      </div>
      <div class="link-arrow">→</div>
    </a>

  </div>

  <div class="footer">
    <div class="footer-line"></div>
    <div class="footer-text">Aguascalientes · Servicio a domicilio</div>
  </div>

</div>
</body>
</html>
